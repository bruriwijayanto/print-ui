server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Safe to set unconditionally: HSTS is scoped to the exact hostname a
    # browser used over HTTPS (printer.ora.my.id via Cloudflare) — it has no
    # effect on plain-HTTP LAN access via the STB's bare IP address.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The build has no inline <script>/<style> (verified: only external
    # asset references), so this stays strict without any 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 60m;

    # Resolve the "backend" upstream at request time (Docker's embedded DNS),
    # not once at nginx startup — otherwise nginx refuses to start at all if
    # the backend container isn't up yet, or crash-loops if it's ever recreated.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        # No URI suffix here on purpose: proxy_pass with a variable disables
        # nginx's usual location-prefix rewriting, so it appends the client's
        # full original URI (already "/api/...") after this value as-is.
        # Adding "/api/" here too would double it into "/api/api/...".
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
