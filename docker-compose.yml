services:
  backend:
    build:
      context: ./backend
    container_name: cups-print-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - cups-network

  frontend:
    build:
      context: ./frontend
    container_name: cups-print-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - cups-network

networks:
  cups-network:
    external: true
